<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SUS Builder V0.1</title>

  <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>
  <h1>Single-Use Systems Builder</h1>
  <p>Vendor-neutral SUS design prototype · V0.1</p>
</header>

<div class="app">

  <aside class="sidebar">

    <h2>Assembly Components</h2>

    <div class="field">
      <label for="bag">Source Bag</label>
      <select id="bag">
        <option value="Sartorius 200 L Bag">Sartorius · 200 L Bag</option>
        <option value="Generic 100 L Bag">Generic · 100 L Bag</option>
      </select>
    </div>

    <div class="field">
      <label for="tube">Transfer Tubing</label>
      <select id="tube">
        <option value="C-Flex 072">Saint-Gobain · C-Flex 072</option>
        <option value="AdvantaFlex">AdvantaPure · AdvantaFlex</option>
        <option value="Tygon PVC">Saint-Gobain · Tygon PVC</option>
      </select>
    </div>

    <div class="field">
      <label for="pumpTube">Pump Tubing</label>
      <select id="pumpTube">
        <option value="PharMed BPT">Saint-Gobain · PharMed BPT</option>
        <option value="PharmaPure">Saint-Gobain · PharmaPure</option>
        <option value="AdvantaSil APSPG">AdvantaPure · AdvantaSil APSPG</option>
        <option value="SPT-60L">Saint-Gobain · Sani-Tech SPT-60L</option>
      </select>
    </div>

    <div class="field">
      <label for="pump">Pump</label>
      <select id="pump">
        <option value="Watson-Marlow">Watson-Marlow</option>
        <option value="Masterflex">Masterflex</option>
      </select>
    </div>

    <div class="field">
      <label for="connector">Aseptic Connector</label>
      <select id="connector">
        <option value="AseptiQuik C">CPC · AseptiQuik C</option>
        <option value="MicroCNX">CPC · MicroCNX</option>
      </select>
    </div>

    <div class="field">
      <label for="filter">Filter</label>
      <select id="filter">
        <option value="Meissner 0.2 µm">Meissner · 0.2 µm Filter</option>
        <option value="No Filter">No Filter</option>
      </select>
    </div>

    <div class="field">
      <label for="reactor">Destination</label>
      <select id="reactor">
        <option value="2000 L Bioreactor">2000 L Bioreactor</option>
        <option value="500 L Bioreactor">500 L Bioreactor</option>
        <option value="Hold Bag">Hold Bag</option>
      </select>
    </div>

  </aside>

  <main>

    <section class="panel">

      <h2>Assembly Illustration</h2>

      <span class="status">● Prototype configuration</span>

      <svg id="drawing"
           viewBox="0 0 1100 290"
           role="img"
           aria-label="Single-use system assembly">

        <!-- Tubing path -->

        <line class="tube" x1="145" y1="145" x2="260" y2="145"/>
        <line class="tube" x1="380" y1="145" x2="445" y2="145"/>
        <line class="tube" x1="565" y1="145" x2="625" y2="145"/>
        <line class="tube" x1="745" y1="145" x2="805" y2="145"/>
        <line class="tube" x1="925" y1="145" x2="970" y2="145"/>

        <!-- Bag -->

        <rect class="node"
              x="25"
              y="100"
              width="120"
              height="90"
              rx="12"/>

        <text id="bagLabel"
              class="svg-title"
              x="85"
              y="135">
          200 L Bag
        </text>

        <text class="svg-sub"
              x="85"
              y="155">
          SOURCE
        </text>

        <!-- Transfer tubing -->

        <text id="tubeLabel"
              class="svg-sub"
              x="200"
              y="125">
          C-Flex 072
        </text>

        <!-- Pump -->

        <rect class="pump-node"
              x="260"
              y="100"
              width="120"
              height="90"
              rx="45"/>

        <text id="pumpLabel"
              class="svg-title"
              x="320"
              y="135">
          Watson-Marlow
        </text>

        <text id="pumpTubeLabel"
              class="svg-sub"
              x="320"
              y="157">
          PharMed BPT
        </text>

        <!-- Connector -->

        <rect class="connector-node"
              x="445"
              y="112"
              width="120"
              height="66"
              rx="10"/>

        <text id="connectorLabel"
              class="svg-title"
              x="505"
              y="142">
          AseptiQuik C
        </text>

        <text class="svg-sub"
              x="505"
              y="160">
          ASEPTIC
        </text>

        <!-- Filter -->

        <rect class="filter-node"
              x="625"
              y="100"
              width="120"
              height="90"
              rx="12"/>

        <text id="filterLabel"
              class="svg-title"
              x="685"
              y="135">
          0.2 µm
        </text>

        <text class="svg-sub"
              x="685"
              y="157">
          FILTER
        </text>

        <!-- Destination -->

        <rect class="node"
              x="805"
              y="90"
              width="120"
              height="110"
              rx="28"/>

        <text id="reactorLabel"
              class="svg-title"
              x="865"
              y="135">
          2000 L
        </text>

        <text class="svg-sub"
              x="865"
              y="157">
          BIOREACTOR
        </text>

      </svg>

      <p class="note">
        V0.1 schematic only — not an engineering drawing or validated assembly.
      </p>

    </section>

    <section class="panel">

      <h2>Bill of Materials</h2>

      <table>
        <thead>
          <tr>
            <th>Type</th>
            <th>Manufacturer</th>
            <th>Product</th>
            <th>Qty</th>
          </tr>
        </thead>

        <tbody id="bom"></tbody>

      </table>

    </section>

  </main>

</div>

<script src="js/app.js"></script>

</body>
</html>
